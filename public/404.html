<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060505">
<meta name="color-scheme" content="dark">
<title>Seite nicht gefunden | Schattenschreck</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face { font-family: "Oswald"; src: url("/fonts/oswald.woff2") format("woff2"); font-weight: 200 700; font-display: swap; }
@font-face { font-family: "DM Sans"; src: url("/fonts/dm-sans.woff2") format("woff2"); font-weight: 100 1000; font-display: swap; }
*, *::before, *::after { box-sizing: border-box; }
html { background: #060505; color-scheme: dark; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  place-items: center;
  padding: 32px 20px;
  background: radial-gradient(ellipse at 50% 100%, rgba(170, 8, 18, 0.22), transparent 60%), #060505;
  color: #dcd5ca;
  font: 17px/1.65 "DM Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  text-align: center;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid #ff3b3b; outline-offset: 4px; }
main { width: 100%; max-width: 560px; }
.logo { display: block; width: min(300px, 76vw); height: auto; margin: 0 auto 48px; }
h1 {
  margin: 0;
  color: #f3ede2;
  font: 600 clamp(44px, 12vw, 80px)/0.98 "Oswald", "Arial Narrow", sans-serif;
  text-transform: uppercase;
  text-wrap: balance;
}
p { max-width: 40ch; margin: 22px auto 0; color: #a9a198; text-wrap: pretty; }
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 52px;
  margin-top: 34px;
  padding: 0 28px;
  background: #c20d18;
  color: #fff;
  font: 500 16px "Oswald", "Arial Narrow", sans-serif;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  transition: background 0.18s ease;
}
.button:hover { background: #e4141f; }
</style>
</head>
<body>
<main>
  <a href="/" aria-label="Zur Startseite von Schattenschreck"><img class="logo" src="/images/logo.png" alt="Schattenschreck" width="485" height="83"></a>
  <h1>Hier ist nur Nebel.</h1>
  <p>Diese Seite gibt es nicht oder nicht mehr. Auf der Startseite findest du alles zum Schattenschreck am 31. Oktober 2027.</p>
  <a class="button" href="/">Zur Startseite</a>
</main>
</body>
</html>
