<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#090909">
<title>Team-Login — Schattenschreck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/ss.css">
</head>
<body>
<header class="header"><div class="container header-inner">
<a href="/" aria-label="Zur Startseite"><img class="logo" src="https://i.imgur.com/Cl27hzM.png" alt="Schattenschreck" width="130" height="44"></a>
<a class="secondary-button" href="/">Zur Webseite</a>
</div></header>
<main class="container auth-wrap">
<div class="card auth-card">
<div class="label">Nur für Live-Erschrecker</div>
<h1 class="title">Team-Login</h1>
<form id="loginForm" autocomplete="on" novalidate>
<label class="field"><span>E-Mail</span><input id="email" name="email" type="email" autocomplete="username" required></label>
<label class="field"><span>Passwort</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
<p class="err" id="err" role="alert" aria-live="polite"></p>
<button class="primary-button" id="btn" type="submit">Einloggen</button>
</form>
<p class="hint">Kein Zugang? Melde dich beim Team, Konten werden nur manuell angelegt.</p>
</div>
</main>
<script src="/login.js"></script>
</body>
</html>
